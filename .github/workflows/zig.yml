name: Zig

on:
  push:
    branches: [main, claude/zig-0.16-github-actions-2aququ]
    paths:
      - 'zig-sqlite/**'
      - '.github/workflows/zig.yml'
  pull_request:
    branches: [main]
    paths:
      - 'zig-sqlite/**'
      - '.github/workflows/zig.yml'
  workflow_dispatch:

concurrency:
  group: zig-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig fmt --check
        working-directory: zig-sqlite
        run: zig fmt --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install qemu
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: sudo apt-get update -y && sudo apt-get install -y qemu-user-binfmt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            zig-sqlite/zig-cache
            ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('zig-sqlite/build.zig.zon') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-${{ hashFiles('zig-sqlite/build.zig.zon') }}-

      - name: Ensure zig package-fetch tmp dir exists
        shell: bash
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"

      - name: Run tests (in-memory)
        working-directory: zig-sqlite
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: zig build test -Dci=true -Din_memory=true --summary all -fqemu -fwine

      - name: Run tests (in-memory)
        working-directory: zig-sqlite
        if: ${{ matrix.os != 'ubuntu-24.04' }}
        run: zig build test -Dci=true -Din_memory=true --summary all
