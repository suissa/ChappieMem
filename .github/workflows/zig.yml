name: Zig

on:
  push:
    branches: [main]
    paths:
      - 'zig-sqlite/**'
      - 'memweave-zig/**'
      - '.github/workflows/zig.yml'
  pull_request:
    branches: [main]
    paths:
      - 'zig-sqlite/**'
      - 'memweave-zig/**'
      - '.github/workflows/zig.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig fmt --check (zig-sqlite)
        working-directory: zig-sqlite
        run: zig fmt --check .

      - name: zig fmt --check (memweave-zig)
        working-directory: memweave-zig
        run: zig fmt --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install qemu
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: sudo apt-get update -y && sudo apt-get install -y qemu-user-binfmt

      # mlugg/setup-zig already caches $ZIG_GLOBAL_CACHE_DIR (compiler + fetched
      # packages) keyed on the Zig version, so no extra actions/cache step is needed.
      - name: Ensure zig package-fetch tmp dir exists
        shell: bash
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"

      - name: Run tests (in-memory)
        working-directory: zig-sqlite
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: zig build test -Dci=true -Din_memory=true --summary all -fqemu -fwine

      - name: Run tests (in-memory)
        working-directory: zig-sqlite
        if: ${{ matrix.os != 'ubuntu-24.04' }}
        run: zig build test -Dci=true -Din_memory=true --summary all

  memweave-zig-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # memweave-zig/build.zig.zon declares a local path dependency on
      # ../zig-sqlite for a later phase; Zig 0.16 resolves declared
      # dependencies eagerly even before build.zig calls b.dependency() on
      # them, which pulls in zig-sqlite's own sqlite.org URL dependency and
      # hits the same package-fetch tmp-dir issue fixed for the `test` job.
      - name: Ensure zig package-fetch tmp dir exists
        shell: bash
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"

      - name: Run tests
        working-directory: memweave-zig
        run: zig build test --summary all

  memweave-zig-vector-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Ensure zig package-fetch tmp dir exists
        shell: bash
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"

      # Pin the latest stable sqlite-vec release used by this port. The
      # checksum comes from the release metadata; this keeps the integration
      # signal reproducible instead of executing a moving binary.
      - name: Download sqlite-vec v0.1.9
        shell: bash
        run: |
          curl -fsSL \
            https://github.com/asg017/sqlite-vec/releases/download/v0.1.9/sqlite-vec-0.1.9-loadable-linux-x86_64.tar.gz \
            -o sqlite-vec.tar.gz
          echo "b959baa1d8dc88861b1edb337b8587178cdcb12d60b4998f9d10b6a82052d5d7  sqlite-vec.tar.gz" | sha256sum -c -
          mkdir sqlite-vec
          tar -xzf sqlite-vec.tar.gz -C sqlite-vec
          SQLITE_VEC_EXTENSION="$(find "$GITHUB_WORKSPACE/sqlite-vec" -type f -name 'vec0.so' -print -quit)"
          test -n "$SQLITE_VEC_EXTENSION"
          echo "SQLITE_VEC_EXTENSION=$SQLITE_VEC_EXTENSION" >> "$GITHUB_ENV"

      - name: Run real sqlite-vec vector + hybrid integration test
        working-directory: memweave-zig
        shell: bash
        run: zig build test-vector -Dsqlite-vec-extension="$SQLITE_VEC_EXTENSION" --summary all
